start:
  title: Gorffennwch brofi eich hunaniaeth drwy fewngofnodi i'ch bancio ar-lein
  contentA:
    - <p class="govuk-body">Rhaid i'ch cyfrif fod:</p>
    - <ul class="govuk-list govuk-list--bullet">
    - <li>cyfrif cyfredol, nid cyfrif cynilo, cyfrif cerdyn credyd na math arall o gyfrif</li>
    - <li>yn eich enw (gallwch ddefnyddio cyfrif ar y cyd)</li>
    - <li>mwy na 3 mis oed</li>
    - </ul>
  details:
    summary: Sut mae bancio ar-lein yn profi fy hunaniaeth?
    content: Mae gan fanciau ddiogelwch cryf iawn, felly pan fyddwch chi'n mewngofnodi, maen nhw'n gwybod mai chi ydyw mewn gwirionedd.<br><br> Yna gall y banc gadarnhau'r manylion a roddoch i ni, i'n helpu i fod yn siŵr mai chi yw pwy rydych chi'n dweud eich bod chi.
  contentB:
    - <h2 class="govuk-heading-m">Cyn i chi fewngofnodi</h2>
    - <p class="govuk-body">Byddwn yn gofyn am eich caniatâd i rannu gwybodaeth o'ch cyfrif gyda chwmni o'r enw Ecospend.</p>
    - <p class="govuk-body">Mae hyn er mwyn i ni allu cysylltu'n ddiogel â'ch banc a chadarnhau eich hunaniaeth. Fe welwch pa wybodaeth fydd yn cael ei rhannu gydag Ecospend cyn i chi gytuno iddi.</p>
    - <p class="govuk-body"><a class="govuk-link govuk-link--no-visited-state" target="_blank" href="https://www.gov.uk/government/publications/govuk-one-login-privacy-notice">Ein hysbysiad preifatrwydd (yn agor mewn tab newydd)</a> mae ganddo fwy o fanylion am sut y bydd eich gwybodaeth yn cael ei defnyddio.</p>
    - <p class="govuk-body">Mae Ecospend yn cael ei reoleiddio gan y <a class="govuk-link govuk-link--no-visited-state" target="_blank" href="https://register.fca.org.uk/s/firm?id=0010X00004KSo9HQAT">Awdurdod Ymddygiad Ariannol (yn agor mewn tab newydd)</a>.</p>
  primaryButton: Parhau
  secondaryLink: Profi eich hunaniaeth mewn ffordd arall

consent:
  title: Cytuno i rannu gwybodaeth o'ch cyfrif banc neu gymdeithas adeiladu gydag Ecospend
  contentA:
    - <p class="govuk-body">I brofi pwy ydych chi gan ddefnyddio bancio ar-lein, mae angen i chi rannu rhywfaint o wybodaeth o'ch cyfrif <strong>{{ selectedBankName }}</strong> gydag Ecospend.</p>
    - <p class="govuk-body">Mae hyn i wirio bod eich cyfrif yn real ac i amddiffyn rhag twyll.</p>
    - <h2 class="govuk-heading-m">Gwybodaeth sy'n cael ei rhannu </h2>
    - <p class="govuk-body">Bydd gan Ecospend fynediad untro i wirio:</p>
    - <ul class="govuk-list govuk-list--bullet">
    - <li>rhif eich cyfrif a'ch cod didoli</li>
    - <li>bod eich cyfrif yn weithredol (drwy gadarnhau bod trafodion diweddar - ni fyddant yn rhannu manylion y trafodion)</li>
    - </ul>
  insetText: Bydd Ecospend yn dileu eich gwybodaeth yn ddiogel ar ôl i'r gwiriad gael ei gwblhau.
  contentB:
    - <h2 class="govuk-heading-m">Gwybodaeth nad yw'n cael ei rhannu</h2>
    - <p class="govuk-body">Ni fydd Ecospend yn:</p>
    - <ul class="govuk-list govuk-list--bullet">
    - <li>gweld eich manylion mewngofnodi bancio ar-lein</li>
    - <li>defnyddio eich gwybodaeth i gymryd taliadau</li>
    - </ul>
    - <p class="govuk-body">Ni fydd unrhyw wybodaeth am eich cyfrif banc yn cael ei rhannu â'r gwasanaeth llywodraeth rydych chi'n ei ddefnyddio.</p>
  checkbox:
    legendText: Rhoi caniatâd i rannu gwybodaeth eich cyfrif banc
    itemText: Rwy'n cytuno i rannu gwybodaeth fy nghyfrif banc gydag Ecospend
    errorMessage: Rhaid i chi gytuno i rannu gwybodaeth eich cyfrif banc i barhau
  primaryButton: Parhau
  secondaryLink: Profi eich hunaniaeth mewn ffordd arall

chooseBank:
  title: Dewiswch eich banc neu gymdeithas adeiladu
  errorMessage: Dewiswch fanc neu gymdeithas adeiladu
  notListedLinkText: Nid yw fy banc wedi'i restru
  primaryButton: Parhau

bankProblem:
  title: Mae'n ddrwg gen i, mae problem
  content: Nid yw eich banc na'ch cymdeithas adeiladu ar gael.
  radio:
    legend: Beth hoffech chi ei wneud?
    errorMessage: Dewiswch beth hoffech chi ei wneud
    one:
      title: Ceisiwch brofi pwy ydych chi eto gan ddefnyddio bancio ar-lein.
      hint: Gallwch roi cynnig arall arni gan ddefnyddio'r un banc neu gymdeithas adeiladu, neu roi cynnig ar un gwahanol.
    two:
      title: Profi eich hunaniaeth mewn ffordd arall
  primaryButton: Parhau
