start:
  title: Finish proving your identity by signing in to your online banking
  contentA:
    - <p class="govuk-body">Your account must be:</p>
    - <ul class="govuk-list govuk-list--bullet">
    - <li>a current account, not a savings account, credit card account or other type of account</li>
    - <li>in your name (you can use a joint account)</li>
    - <li>more than 3 months old</li>
    - </ul>
  details:
    summary: How does online banking prove my identity?
    content: Banks have very strong security, so when you sign in, they know it’s really you.<br><br> The bank can then confirm the details you gave us, to help us be sure you are who you say you are.
  contentB:
    - <h2 class="govuk-heading-m">Before you sign in</h2>
    - <p class="govuk-body">We’ll ask for your approval to share information from your account with a company called Ecospend.</p>
    - <p class="govuk-body">This is so we can securely connect with your bank and confirm your identity. You’ll see what information will be shared with Ecospend before you agree to it.</p>
    - <p class="govuk-body"><a class="govuk-link govuk-link--no-visited-state" target="_blank" href="https://www.gov.uk/government/publications/govuk-one-login-privacy-notice">Our privacy notice (opens in new tab)</a> has more detail about how your information will be used.</p>
    - <p class="govuk-body">Ecospend is regulated by the <a class="govuk-link govuk-link--no-visited-state" target="_blank" href="https://register.fca.org.uk/s/firm?id=0010X00004KSo9HQAT">Financial Conduct Authority (opens in a new tab)</a>.</p>
  primaryButton: Continue
  secondaryLink: Prove your identity another way

consent:
  title: Agree to share information from your bank or building society account with Ecospend
  contentA:
    - <p class="govuk-body">To prove your identity using online banking, you need to share some information from your <strong>{{ selectedBankName }}</strong> account with Ecospend.</p>
    - <p class="govuk-body">This is to check your account is real and protect against fraud.</p>
    - <h2 class="govuk-heading-m">Information that’s shared </h2>
    - <p class="govuk-body">Ecospend will have one-off access to check:</p>
    - <ul class="govuk-list govuk-list--bullet">
    - <li>your account number and sort code</li>
    - <li>that your account is active (by confirming there are recent transactions - they will not share details of the transactions)</li>
    - </ul>
  insetText: Ecospend will securely delete your information after the check is complete.
  contentB:
    - <h2 class="govuk-heading-m">Information that’s not shared</h2>
    - <p class="govuk-body">Ecospend will not:</p>
    - <ul class="govuk-list govuk-list--bullet">
    - <li>see your online banking sign-in details</li>
    - <li>use your information to take payments</li>
    - </ul>
    - <p class="govuk-body">None of your bank account information will be shared with the government service you’re using.</p>
  checkbox:
    legendText: Give approval for your bank account information to be shared
    itemText: I agree to my bank account information being shared with Ecospend
    errorMessage: You must agree to share your bank account information to continue
  primaryButton: Continue
  secondaryLink: Prove your identity another way

chooseBank:
  title: Choose your bank or building society
  errorMessage: Select a bank or building society
  notListedLinkText: My bank is not listed
  primaryButton: Continue

bankProblem:
  title: Sorry, there is a problem
  content: Your bank or building society is unavailable.
  radio:
    legend: What would you like to do?
    errorMessage: Select what you would like to do
    one:
      title: Try again to prove your identity using online banking
      hint: You can try again using the same bank or building society or try a different one.
    two:
      title: Prove your identity another way
  primaryButton: Continue

selectSignInMethod:
  title: How do you want to sign in to your online banking?
  radio:
    legend: How do you want to sign in to your online banking?
    errorMessage: Select how you want to sign in to your online banking
    one:
      title: Use your phone or tablet and scan a QR code
      hint: You can use your bank’s app or mobile website to prove your identity.
    two:
      title: Stay on this device and use your bank’s website
      hint: When you continue, you’ll be sent to your bank’s website.
  primaryButton: Continue

checkDetails:
  title: We need to confirm your details
  content:
    - We’ll check that the details you gave us match the information from your bank.
    - It can take up to 10 seconds to continue to the next page. Do not reload or close this page.
