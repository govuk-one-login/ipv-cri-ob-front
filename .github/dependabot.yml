version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    open-pull-requests-limit: 10
    commit-message:
      prefix: BAU
    groups:
      vite:
        patterns:
          - 'vite'
          - 'vite-plugin-*'
      vitest:
        patterns:
          - '@vitest/*'
          - 'vitest'
      eslint:
        patterns:
          - '@eslint/js'
          - 'eslint'
          - 'eslint-plugin-*'
      playwright:
        patterns:
          - '@playwright/test'
          - 'playwright-bdd'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-plugin-*'
          - 'eslint-config-prettier'
      typescript:
        patterns:
          - 'typescript'
          - 'typescript-eslint'

  - package-ecosystem: docker
    directories:
      - '/'
      - 'test/browser'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    commit-message:
      prefix: BAU
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    commit-message:
      prefix: BAU
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: pre-commit
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    commit-message:
      prefix: BAU
    groups:
      pre-commit-hooks:
        patterns:
          - '*'
