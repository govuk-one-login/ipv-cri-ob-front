version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: 'node'
        versions: ['26.x']
      # Exclude major version updates - next major version has incompatible license
      - dependency-name: 'ua-parser-js'
        update-types: ['version-update:semver-major']
    groups:
      vite:
        patterns:
          - 'vite'
          - 'vite-plugin-*'
      vitest:
        patterns:
          - '@vitest/*'
          - 'vitest'
      oxc:
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
      one-login-fe:
        patterns:
          - '@govuk-one-login/frontend-*'
    commit-message:
      prefix: BAU
  - package-ecosystem: docker
    directories:
      - '/'
      - 'test/browser'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    commit-message:
      prefix: BAU
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: monday
      time: '03:00'
    target-branch: main
    labels:
      - dependabot
    commit-message:
      prefix: BAU
