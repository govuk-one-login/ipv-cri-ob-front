name: PR check

on: pull_request
permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    concurrency:
      group: pre-commit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          all-files: true
          install-dependencies: 'true'
          node-version-file: '.nvmrc'

  static-checks:
    name: Run static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: static-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: i18n check
        run: npm run check-translation

      - name: SAM lint
        run: sam validate --region eu-west-2 -t deploy/template.yml --lint

  unit-tests:
    name: Run unit tests
    permissions:
      contents: read
    needs: static-checks
    uses: ./.github/workflows/run-unit-tests.yml

  scan-repo:
    name: CodeQL and Sonar scans
    permissions:
      contents: read
      security-events: write
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs: unit-tests
    uses: ./.github/workflows/scan-repo.yml
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  infra-tests:
    name: Run infra tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: infra-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: CloudFormation template tests
        run: npm run test:infra

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: static-checks
    concurrency:
      group: integration-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: Integration tests
        run: npm run test:integration

  resolve-test-versions:
    name: Resolve test versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      playwright-version: ${{ steps.resolve-playwright-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Playwright version
        id: resolve-playwright-version
        run: |
          version="$(yq -r '.devDependencies["@playwright/test"] // .dependencies["@playwright/test"] // ""' package.json)"
          test -n "$version" || { echo "No @playwright/test version found in package.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  browser-tests:
    name: Run browser tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - resolve-test-versions
      - static-checks
    concurrency:
      group: browser-tests-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ needs.resolve-test-versions.outputs.playwright-version }}

      - name: Setup Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

  merge-status:
    name: Merge status
    runs-on: ubuntu-latest
    concurrency:
      group: merge-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    needs:
      - pre-commit
      - static-checks
      - unit-tests
      - infra-tests
      - integration-tests
      - browser-tests
    if: always()
    steps:
      - run: |
          failed=()
          [[ "${{ needs.pre-commit.result }}" != "success" ]] && failed+=("pre-commit")
          [[ "${{ needs.static-checks.result }}" != "success" ]] && failed+=("static-checks")
          [[ "${{ needs.unit-tests.result }}" != "success" ]] && failed+=("unit-tests")
          [[ "${{ needs.infra-tests.result }}" != "success" ]] && failed+=("infra-tests")
          [[ "${{ needs.integration-tests.result }}" != "success" ]] && failed+=("integration-tests")
          [[ "${{ needs.browser-tests.result }}" != "success" ]] && failed+=("browser-tests")
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "The following jobs failed: ${failed[*]}"
            exit 1
          fi
